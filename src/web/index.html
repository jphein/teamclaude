<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamClaude Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c87f3a' stroke-width='2.5'/><path d='M 16 5 A 11 11 0 0 1 27 16' fill='none' stroke='%23c87f3a' stroke-width='3' stroke-linecap='round'/><circle cx='16' cy='5' r='2.5' fill='%23c87f3a'/></svg>">
<style>
  :root {
    --bg: #faf7f2;
    --panel: #ffffff;
    --panel-border: #e8e1d4;
    --text: #2a2520;
    --text-dim: #7a7468;
    --accent: #b86a1a;
    --accent-soft: #c87f3a;
    --good: #4a7c4e;
    --warn: #c78a1f;
    --bad: #b04040;
    --bar-bg: #ece6d8;
    --bar-good: #5a9a5e;
    --bar-warn: #d4a035;
    --bar-bad: #c45050;
    --active-glow: rgba(184, 106, 26, 0.15);
    --log-bg: #f5f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1612;
      --panel: #251f18;
      --panel-border: #3a3128;
      --text: #ebe4d6;
      --text-dim: #8a8170;
      --accent: #e89030;
      --accent-soft: #d4801f;
      --good: #6abe6f;
      --warn: #e5b045;
      --bad: #d46060;
      --bar-bg: #312820;
      --bar-good: #5a9a5e;
      --bar-warn: #c89534;
      --bar-bad: #b04040;
      --active-glow: rgba(232, 144, 48, 0.18);
      --log-bg: #1e1810;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--panel-border);
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 .sub {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.95rem;
    margin-left: 0.5rem;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .threshold-row {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 0.875rem;
  }
  .threshold-row label { color: var(--text-dim); }
  .threshold-row input[type=range] {
    width: 180px;
    accent-color: var(--accent);
  }
  .threshold-row .val {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
    min-width: 3rem;
    text-align: right;
  }

  /* ── Buttons ── */
  button.switch, .btn-restart, .btn-ghost, .btn-danger {
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  button.switch {
    align-self: start;
    grid-row: 1;
    grid-column: 2;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.35rem 0.75rem;
  }
  button.switch:hover:not(:disabled) { background: var(--accent); color: #fff; }
  button.switch:disabled { opacity: 0.4; cursor: default; }
  .btn-restart {
    background: transparent;
    color: var(--bad);
    border: 1px solid var(--bad);
    padding: 0.32rem 0.7rem;
    font-size: 0.82rem;
  }
  .btn-restart:hover:not(:disabled) { background: var(--bad); color: #fff; }
  .btn-restart:disabled { opacity: 0.4; cursor: default; }
  .restart-status {
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    padding: 0.18rem 0.5rem;
    font-size: 0.75rem;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-svc {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.32rem 0.7rem;
    font-size: 0.82rem;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .btn-svc:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .btn-svc:disabled { opacity: 0.4; cursor: default; }

  /* ── Service bar ── */
  .svc {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.6rem 1.125rem;
    margin-bottom: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
  }
  .svc-stats {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.25rem 1.1rem;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .svc-stats .svc-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .svc-stats b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .svc-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  /* ── Account cards ── */
  .cards { display: grid; gap: 0.875rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 1rem 1.125rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem 1rem;
    align-items: center;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 18px var(--active-glow);
  }
  .card.off { opacity: 0.55; }
  .card-actions {
    grid-row: 1;
    grid-column: 2;
    align-self: start;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card-actions .btn-ghost { padding: 0.3rem 0.6rem; font-size: 0.8rem; }

  /* ── Reauth panel (shown inside a card while a reauth session is pending) ── */
  .reauth-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 1px dashed var(--panel-border);
  }
  .reauth-panel .reauth-msg {
    flex-basis: 100%;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  .reauth-panel .reauth-msg a { color: var(--accent); }
  .reauth-panel input {
    flex: 1;
    min-width: 9rem;
    padding: 0.3rem 0.5rem;
    font: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--log-bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
  }
  .reauth-panel input:focus { outline: none; border-color: var(--accent); }
  .reauth-panel .btn-ghost { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  .card .name {
    font-size: 1.05rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card .name .badge {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--bar-bg);
    color: var(--text-dim);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .card.active .name .badge.active-badge { background: var(--accent); color: #fff; }
  .card .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    grid-column: 1 / -1;
  }
  .bars {
    display: grid;
    grid-template-columns: max-content 1fr max-content;
    column-gap: 0.625rem;
    row-gap: 0.4rem;
    align-items: center;
    grid-column: 1 / -1;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .bars .lbl { letter-spacing: 0.02em; }
  .bars .bar {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .bars .bar > span {
    display: block;
    height: 100%;
    background: var(--bar-good);
    transition: width 0.3s, background 0.3s;
    border-radius: 4px;
  }
  .bars .pct {
    font-variant-numeric: tabular-nums;
    min-width: 3rem;
    text-align: right;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.25;
  }
  .bars .pct .reset {
    font-size: 0.66rem;
    color: var(--text-dim);
    white-space: nowrap;
    cursor: help;
  }
  .bars .bar.warn > span { background: var(--bar-warn); }
  .bars .bar.bad > span { background: var(--bar-bad); }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--good);
  }
  .status-throttled { background: var(--warn); }
  .status-exhausted, .status-error { background: var(--bad); }

  /* ── Bottom panels ── */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 0.875rem;
    margin-top: 0.875rem;
  }
  @media (max-width: 740px) {
    .bottom-row { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .panel-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.625rem;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .active-count {
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ── Activity feed ── */
  #activeReqs { flex-shrink: 0; }
  .activity-item {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    padding: 0.22rem 0;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    min-width: 0;
  }
  .activity-item + .activity-item {
    border-top: 1px solid var(--panel-border);
  }
  .activity-sys { color: var(--text-dim); font-style: italic; }
  .act-dot {
    flex-shrink: 0;
    display: inline-block;
    width: 1.1rem;
    text-align: center;
    font-style: normal;
  }
  .act-dot-active { color: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .act-dot-ok  { color: var(--good); }
  .act-dot-warn { color: var(--warn); }
  .act-dot-bad  { color: var(--bad); }
  .act-dot-sys  { color: var(--text-dim); }
  .act-method {
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .act-path {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .act-account {
    color: var(--text-dim);
    font-size: 0.73rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 14ch;
    flex-shrink: 1;
  }
  .act-dur {
    color: var(--text-dim);
    font-size: 0.73rem;
    margin-left: auto;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .act-status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 700;
    min-width: 2.2rem;
  }
  .act-ok   { color: var(--good); }
  .act-warn { color: var(--warn); }
  .act-bad  { color: var(--bad); }
  .act-sep {
    height: 1px;
    background: var(--panel-border);
    margin: 0.4rem 0;
    flex-shrink: 0;
  }
  .completed-log {
    height: 260px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .completed-log:empty::before {
    content: 'No requests yet';
    display: block;
    text-align: center;
    padding: 2rem 0;
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  /* ── Logs panel ── */
  .log-box {
    height: 320px;
    overflow-y: auto;
    background: var(--log-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 0.5rem 0.625rem;
    font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
    font-size: 0.69rem;
    line-height: 1.6;
  }
  .log-box:empty::before {
    content: 'Connecting to log stream…';
    display: block;
    text-align: center;
    padding: 2rem 0;
    color: var(--text-dim);
    font-style: italic;
  }
  .log-line {
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text-dim);
  }
  .log-line.log-err  { color: var(--bad); }
  .log-line.log-warn { color: var(--warn); }

  /* ── Footer ── */
  .err {
    background: var(--bad);
    color: #fff;
    padding: 0.6rem 1rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  footer {
    margin-top: 1.25rem;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TeamClaude<span class="sub">multi-account proxy</span></h1>
    <div class="header-right">
      <div class="threshold-row">
        <label for="thr">Rotate at</label>
        <input type="range" id="thr" min="50" max="100" step="1" value="98">
        <span class="val" id="thrVal">98%</span>
      </div>
    </div>
  </header>

  <div id="errBox"></div>

  <!-- Service manager -->
  <div class="svc">
    <div class="svc-stats" id="svcStats"><span class="svc-title">Service</span></div>
    <div class="svc-actions">
      <span id="svcMsg" class="restart-status"></span>
      <button id="probeBtn" class="btn-svc" title="Re-read every account's quota from the zero-spend usage endpoint — use after a plan change or upgrade">↻ Refresh quotas</button>
      <button id="reloadBtn" class="btn-svc" title="Re-sync accounts from the config file without a restart (picks up new accounts, tokens, priorities)">⟲ Reload config</button>
      <button id="restartBtn" class="btn-restart" title="systemctl --user restart teamclaude">Restart</button>
      <span id="restartStatus" class="restart-status"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="bottom-row">
    <!-- Activity panel -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="panel-title">Activity</span>
        <span id="activeCount" class="active-count"></span>
      </div>
      <div id="activeReqs"></div>
      <div class="act-sep" id="actSep" style="display:none"></div>
      <div class="completed-log" id="completedLog"></div>
    </div>

    <!-- Logs panel -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="panel-title">Logs</span>
        <button id="clearLogs" class="btn-ghost">clear</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>

  <footer>
    <span id="meta">Loading…</span>
  </footer>
</div>
<script>
  // All DOM construction uses createElement + textContent — never innerHTML with untrusted data.

  const cardsEl     = document.getElementById('cards');
  const errEl       = document.getElementById('errBox');
  const metaEl      = document.getElementById('meta');
  const thr         = document.getElementById('thr');
  const thrVal      = document.getElementById('thrVal');
  const restartBtn  = document.getElementById('restartBtn');
  const restartStatusEl = document.getElementById('restartStatus');
  const svcStatsEl  = document.getElementById('svcStats');
  const svcMsgEl    = document.getElementById('svcMsg');
  const probeBtn    = document.getElementById('probeBtn');
  const reloadBtn   = document.getElementById('reloadBtn');
  const activeReqsEl = document.getElementById('activeReqs');
  const completedLogEl = document.getElementById('completedLog');
  const activeCountEl  = document.getElementById('activeCount');
  const actSepEl    = document.getElementById('actSep');
  const logBoxEl    = document.getElementById('logBox');

  let lastThreshold = null;
  let saveTimer = null;
  let restartPending = false;
  let wasDisconnected = false;

  // ── DOM builder ──────────────────────────────────────────────
  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'style') node.style.cssText = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('data-')) node.setAttribute(k, v);
      else if (k === 'disabled' && v) node.disabled = true;
      else node.setAttribute(k, v);
    }
    for (const child of (Array.isArray(children) ? children : [children])) {
      if (child == null || child === false) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  // ── Formatters ───────────────────────────────────────────────
  function fmtPct(v) { return v == null ? '—' : (v * 100).toFixed(0) + '%'; }
  function fmtNum(n) { return n.toLocaleString(); }
  function fmtAgo(iso) {
    if (!iso) return 'never';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function fmtMs(ms) {
    if (ms == null) return '—';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }
  function fmtUptime(s) {
    if (s == null) return '—';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    return Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h';
  }
  function fmtMB(bytes) { return bytes == null ? '—' : Math.round(bytes / 1048576) + ' MB'; }
  // Quota windows carry a reset timestamp (ms epoch for unified, ISO for standard).
  // Returns { when, rel, full } or null when the window is already reset / absent.
  function fmtReset(ts) {
    if (ts == null) return null;
    const t = typeof ts === 'number' ? ts : new Date(ts).getTime();
    if (!t || isNaN(t) || t <= Date.now()) return null;
    const d = new Date(t);
    const diffMin = Math.round((t - Date.now()) / 60000);
    const rel = diffMin < 60 ? diffMin + 'm'
      : diffMin < 1440 ? Math.round(diffMin / 60) + 'h'
      : Math.round(diffMin / 1440) + 'd';
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const sameDay = d.toDateString() === new Date().toDateString();
    const when = sameDay ? time : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
    return { when, rel, full: d.toLocaleString() };
  }
  function shortPath(path) {
    return (path || '').replace(/^\/(v1|api)\//, '').split('?')[0] || path;
  }
  function barClass(util, threshold) {
    if (util == null) return 'bar';
    if (util >= threshold) return 'bar bad';
    if (util >= threshold * 0.7) return 'bar warn';
    return 'bar';
  }

  // ── Account cards ────────────────────────────────────────────
  function makeBar(label, util, threshold, resetTs) {
    const inner = el('span', { style: 'width:' + (util == null ? 0 : Math.min(100, util * 100)) + '%' });
    const r = fmtReset(resetTs);
    const pct = el('span', { class: 'pct' }, [
      el('span', { text: fmtPct(util) }),
      r ? el('span', { class: 'reset', title: 'resets ' + r.full + ' (in ' + r.rel + ')', text: '↺ ' + r.when }) : null,
    ]);
    return [
      el('span', { class: 'lbl', text: label }),
      el('div', { class: barClass(util, threshold) }, inner),
      pct,
    ];
  }

  function renderAccount(acct, isActive, threshold) {
    const q = acct.quota;
    const u5h = q.unified5h != null ? q.unified5h
      : (q.tokensLimit ? 1 - q.tokensRemaining / q.tokensLimit : null);
    const u7d = q.unified7d;
    const totalTok = acct.usage.totalInputTokens + acct.usage.totalOutputTokens;

    const inFlight = acct.inFlight || 0;
    const nameRow = el('div', { class: 'name' }, [
      el('span', { class: 'status-dot status-' + acct.status }),
      acct.name,
      isActive ? el('span', { class: 'badge active-badge', text: 'active' }) : null,
      acct.disabled ? el('span', { class: 'badge', style: 'background:transparent;color:var(--bad);border:1px solid var(--bad);', text: 'disabled' }) : null,
      inFlight > 0 ? el('span', { class: 'badge', style: 'background:transparent;color:var(--accent,#4a9eff);', text: inFlight + ' live' }) : null,
      el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', text: acct.type }),
    ]);
    const actions = el('div', { class: 'card-actions' }, [
      el('button', { class: 'switch', 'data-name': acct.name, disabled: isActive || acct.disabled, text: 'Switch' }),
      el('button', {
        class: 'btn-ghost toggle-acct', 'data-name': acct.name, 'data-disabled': acct.disabled ? '1' : '',
        title: acct.disabled ? 'Bring this account back into rotation (also clears a stuck error)' : 'Exclude this account from rotation',
        text: acct.disabled ? 'Enable' : 'Disable',
      }),
      acct.type === 'oauth' ? el('button', {
        class: 'btn-ghost reauth-acct', 'data-name': acct.name,
        title: 'Re-run the browser OAuth login for this account (fixes a revoked refresh token). Log into claude.ai as this account before approving.',
        text: 'Reauth',
      }) : null,
    ]);
    const bars = el('div', { class: 'bars' }, [
      ...makeBar('5h', u5h, threshold, q.unified5hReset ?? q.resetsAt),
      ...makeBar('7d', u7d, threshold, q.unified7dReset),
    ]);
    const metaText = fmtNum(acct.usage.totalRequests) + ' requests · '
      + fmtNum(totalTok) + ' tokens · last used ' + fmtAgo(acct.usage.lastUsed)
      + (acct.rateLimitedUntil ? ' · throttled until ' + new Date(acct.rateLimitedUntil).toLocaleTimeString() : '');
    const meta = el('div', { class: 'meta', text: metaText });
    return el('div', { class: 'card' + (isActive ? ' active' : '') + (acct.disabled ? ' off' : ''), 'data-name': acct.name }, [nameRow, actions, bars, meta]);
  }

  // ── Error display ────────────────────────────────────────────
  function showErr(msg) {
    errEl.textContent = '';
    if (msg) errEl.appendChild(el('div', { class: 'err', text: msg }));
  }

  // ── Status poll ──────────────────────────────────────────────
  async function refresh() {
    try {
      const res = await fetch('/teamclaude/status', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (restartPending && wasDisconnected) {
        restartPending = false;
        restartStatusEl.textContent = 'Restarted ✓';
        restartBtn.disabled = false;
        setTimeout(() => { restartStatusEl.textContent = ''; }, 4000);
      }
      wasDisconnected = false;
      showErr('');

      const serverPct = Math.round(data.switchThreshold * 100);
      if (lastThreshold !== serverPct && document.activeElement !== thr) {
        thr.value = serverPct;
        thrVal.textContent = serverPct + '%';
        lastThreshold = serverPct;
      }

      // Cards are rebuilt every poll; the reauth panel is a singleton element
      // re-attached afterwards so a half-typed code (and focus) survives.
      const reauthHadFocus = document.activeElement === reauthCodeEl;
      cardsEl.textContent = '';
      for (const acct of data.accounts) {
        cardsEl.appendChild(renderAccount(acct, acct.name === data.currentAccount, data.switchThreshold));
      }
      attachReauthPanel(reauthHadFocus);

      const sv = data.server || {};
      svcStatsEl.textContent = '';
      svcStatsEl.appendChild(el('span', { class: 'svc-title', text: 'Service' }));
      for (const [label, value] of [
        ['version', sv.version ? 'v' + sv.version : '—'],
        ['uptime', fmtUptime(sv.uptimeSeconds)],
        ['memory', fmtMB(sv.rssBytes)],
        ['pid', sv.pid != null ? String(sv.pid) : '—'],
        ['port', String(sv.port || 3456)],
        ['accounts', data.accounts.filter(a => !a.disabled).length + '/' + data.accounts.length + ' in rotation'],
      ]) {
        svcStatsEl.appendChild(el('span', {}, [label + ' ', el('b', { text: value })]));
      }

      const upDisplay = (sv.upstream || 'api.anthropic.com').replace(/^https?:\/\//, '');
      const portDisplay = sv.port || 3456;
      metaEl.textContent = `Active: ${data.currentAccount} · ${upDisplay}:${portDisplay} · ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      wasDisconnected = true;
      if (!restartPending) {
        showErr('Cannot reach proxy: ' + err.message);
      }
      metaEl.textContent = 'Disconnected';
    }
  }

  // ── Account actions (switch / enable / disable) ──────────────
  cardsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button.switch, button.toggle-acct');
    if (!btn || btn.disabled) return;
    const name = btn.getAttribute('data-name');
    const isToggle = btn.classList.contains('toggle-acct');
    btn.disabled = true;
    try {
      const res = isToggle
        ? await fetch('/teamclaude/account', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
            body: JSON.stringify({ name, disabled: !btn.getAttribute('data-disabled') }),
          })
        : await fetch('/teamclaude/switch', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
            body: JSON.stringify({ account: name }),
          });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'HTTP ' + res.status);
      }
      await refresh();
    } catch (err) {
      showErr((isToggle ? 'Account toggle' : 'Switch') + ' failed: ' + err.message);
      btn.disabled = false;
    }
  });

  // ── Reauth flow (per-account browser OAuth re-login) ─────────
  // One session at a time, mirroring the server. The panel lives inside the
  // pending account's card: a status line with a fallback link to the authorize
  // page, plus a paste-code input for when the localhost callback can't reach
  // the proxy host (e.g. dashboard opened from another machine).
  const reauthCtl = { account: null, timer: null };
  const reauthMsgEl = el('span', { class: 'reauth-msg' });
  const reauthCodeEl = el('input', { type: 'text', placeholder: 'paste code or callback URL', spellcheck: 'false' });
  const reauthSubmitEl = el('button', { class: 'btn-ghost', text: 'Submit' });
  const reauthCancelEl = el('button', { class: 'btn-ghost', text: 'Cancel' });
  const reauthPanel = el('div', { class: 'reauth-panel' }, [reauthMsgEl, reauthCodeEl, reauthSubmitEl, reauthCancelEl]);

  function attachReauthPanel(hadFocus) {
    if (!reauthCtl.account) return;
    for (const card of cardsEl.children) {
      if (card.getAttribute('data-name') === reauthCtl.account) {
        card.appendChild(reauthPanel);
        if (hadFocus) reauthCodeEl.focus();
        return;
      }
    }
  }

  function stopReauth() {
    reauthCtl.account = null;
    if (reauthCtl.timer) { clearInterval(reauthCtl.timer); reauthCtl.timer = null; }
    reauthPanel.remove();
    reauthCodeEl.value = '';
  }

  function handleReauthStatus(st) {
    if (!reauthCtl.account) return;
    if (st.state === 'done') {
      flashSvcMsg('✓ reauthed ' + (st.email || st.account));
      stopReauth();
      refresh();
    } else if (st.state === 'error') {
      showErr('Reauth failed: ' + (st.error || 'unknown error'));
      stopReauth();
    } else if (st.state === 'idle') {
      stopReauth(); // cancelled elsewhere, or the service restarted
    }
    // 'pending' → keep waiting
  }

  async function pollReauth() {
    if (!reauthCtl.account) return;
    try {
      const res = await fetch('/teamclaude/reauth', { cache: 'no-store' });
      if (res.ok) handleReauthStatus(await res.json());
    } catch { /* transient — keep polling */ }
  }

  async function startReauth(btn, name) {
    // Open the tab synchronously (inside the click's user activation) so popup
    // blockers allow it; point it at the authorize URL once the server answers.
    const tab = window.open('about:blank', '_blank');
    btn.disabled = true;
    try {
      const res = await fetch('/teamclaude/reauth', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      if (tab) tab.location = data.authUrl;
      showErr('');
      reauthCtl.account = name;
      reauthCodeEl.value = '';
      reauthMsgEl.textContent = '';
      reauthMsgEl.append(
        'Approve in the ',
        el('a', { href: data.authUrl, target: '_blank', text: 'login page' }),
        ' while logged into claude.ai as ' + name + ' — or paste the code it shows:',
      );
      attachReauthPanel(false);
      if (!reauthCtl.timer) reauthCtl.timer = setInterval(pollReauth, 2000);
    } catch (err) {
      if (tab) tab.close();
      showErr('Reauth failed: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function submitReauthCode() {
    const code = reauthCodeEl.value.trim();
    if (!code) return;
    reauthSubmitEl.disabled = true;
    try {
      const res = await fetch('/teamclaude/reauth/code', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      handleReauthStatus(data);
    } catch (err) {
      showErr('Reauth code submit failed: ' + err.message);
    } finally {
      reauthSubmitEl.disabled = false;
    }
  }

  reauthSubmitEl.addEventListener('click', submitReauthCode);
  reauthCodeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitReauthCode(); });
  reauthCancelEl.addEventListener('click', async () => {
    try {
      await fetch('/teamclaude/reauth/cancel', { method: 'POST', headers: { 'x-teamclaude-control': '1' } });
    } catch { /* the server may be gone; reset the UI regardless */ }
    stopReauth();
  });

  cardsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button.reauth-acct');
    if (!btn || btn.disabled) return;
    startReauth(btn, btn.getAttribute('data-name'));
  });

  // ── Service actions: refresh quotas / reload config ──────────
  function flashSvcMsg(text) {
    svcMsgEl.textContent = text;
    setTimeout(() => { if (svcMsgEl.textContent === text) svcMsgEl.textContent = ''; }, 4000);
  }
  async function svcAction(btn, url, describe) {
    btn.disabled = true;
    try {
      const res = await fetch(url, { method: 'POST', headers: { 'x-teamclaude-control': '1' } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      await refresh();
      flashSvcMsg(describe(data));
    } catch (err) {
      showErr('Service action failed: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }
  probeBtn.addEventListener('click', () =>
    svcAction(probeBtn, '/teamclaude/probe', d => '✓ probed ' + d.probed + ' account' + (d.probed === 1 ? '' : 's')));
  reloadBtn.addEventListener('click', () =>
    svcAction(reloadBtn, '/teamclaude/reload', d => d.added ? '✓ +' + d.added + ' account' + (d.added === 1 ? '' : 's') : '✓ config re-synced'));

  // ── Threshold slider ─────────────────────────────────────────
  thr.addEventListener('input', () => { thrVal.textContent = thr.value + '%'; });
  thr.addEventListener('change', () => {
    clearTimeout(saveTimer);
    const value = Number(thr.value) / 100;
    saveTimer = setTimeout(async () => {
      try {
        const res = await fetch('/teamclaude/threshold', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
          body: JSON.stringify({ value }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'HTTP ' + res.status);
        }
        lastThreshold = Math.round(value * 100);
      } catch (err) {
        showErr('Threshold update failed: ' + err.message);
      }
    }, 100);
  });

  // ── Service restart ──────────────────────────────────────────
  restartBtn.addEventListener('click', async () => {
    restartBtn.disabled = true;
    restartStatusEl.textContent = 'Restarting…';
    restartPending = true;
    try {
      await fetch('/teamclaude/restart', { method: 'POST', headers: { 'x-teamclaude-control': '1' } });
    } catch {
      // Expected — the service is going down
    }
  });

  // ── Activity feed ────────────────────────────────────────────
  const activityMap = new Map(); // id → { method, path, account, ts }

  function renderActiveReqs() {
    const now = Date.now();
    // Evict stale in-flight entries: a request that never got a matching req_end
    // (client aborted mid-body, or the process restarted under it) would otherwise
    // linger as a permanent "active" row with an ever-climbing timer.
    for (const [id, r] of activityMap) if (now - r.ts > 300000) activityMap.delete(id);
    activeReqsEl.textContent = '';
    const entries = [...activityMap.values()];
    activeCountEl.textContent = entries.length > 0 ? entries.length + ' active' : '';
    actSepEl.style.display = entries.length > 0 ? '' : 'none';

    for (const r of entries) {
      const elapsed = ((now - r.ts) / 1000).toFixed(1);
      activeReqsEl.appendChild(el('div', { class: 'activity-item' }, [
        el('span', { class: 'act-dot act-dot-active', text: '●' }),
        el('span', { class: 'act-method', text: r.method }),
        el('span', { class: 'act-path', text: ' ' + shortPath(r.path) }),
        r.account ? el('span', { class: 'act-account', text: ' → ' + r.account }) : null,
        el('span', { class: 'act-dur', text: elapsed + 's' }),
      ]));
    }
  }

  function makeCompletedRow(evt) {
    if (evt.type === 'req_end') {
      const st = evt.status;
      const cls = st >= 500 ? 'bad' : st >= 400 ? 'warn' : 'ok';
      const icon = st >= 500 ? '✗' : st >= 400 ? '⚠' : '✓';
      return el('div', { class: 'activity-item' }, [
        el('span', { class: 'act-dot act-dot-' + cls, text: icon }),
        el('span', { class: 'act-status act-' + cls, text: String(st || '?') }),
        el('span', { class: 'act-method', text: ' ' + (evt.method || '') }),
        el('span', { class: 'act-path', text: ' ' + shortPath(evt.path) }),
        evt.account ? el('span', { class: 'act-account', text: ' → ' + evt.account }) : null,
        el('span', { class: 'act-dur', text: fmtMs(evt.ms) }),
      ]);
    }
    if (evt.type === 'switched') {
      return el('div', { class: 'activity-item activity-sys' }, [
        el('span', { class: 'act-dot act-dot-sys', text: '↩' }),
        el('span', { text: 'Switched to ' + evt.account }),
      ]);
    }
    if (evt.type === 'threshold') {
      return el('div', { class: 'activity-item activity-sys' }, [
        el('span', { class: 'act-dot act-dot-sys', text: '⚙' }),
        el('span', { text: 'Threshold → ' + Math.round(evt.value * 100) + '%' }),
      ]);
    }
    if (evt.type === 'reauth') {
      return el('div', { class: 'activity-item activity-sys' }, [
        el('span', { class: 'act-dot act-dot-sys', text: '⟳' }),
        el('span', { text: 'Reauth started for ' + evt.name }),
      ]);
    }
    return el('div', { class: 'activity-item activity-sys' }, [el('span', { text: evt.type })]);
  }

  function prependCompleted(evt) {
    completedLogEl.insertBefore(makeCompletedRow(evt), completedLogEl.firstChild || null);
    while (completedLogEl.children.length > 150) completedLogEl.removeChild(completedLogEl.lastChild);
  }

  function connectActivity() {
    const es = new EventSource('/teamclaude/activity');
    // On (re)connect, drop any active entries: their req_end may have fired while
    // we were disconnected and won't be in the terminal-event replay, so they'd
    // otherwise stick forever. The replay repopulates the completed log.
    es.onopen = () => { activityMap.clear(); renderActiveReqs(); };
    es.onmessage = (e) => {
      const evt = JSON.parse(e.data);
      if (evt.type === 'req_start') {
        activityMap.set(evt.id, { method: evt.method, path: evt.path, account: null, ts: evt.ts });
      } else if (evt.type === 'req_routed') {
        const r = activityMap.get(evt.id);
        if (r) r.account = evt.account;
      } else if (evt.type === 'req_end') {
        activityMap.delete(evt.id);
        prependCompleted(evt);
      } else if (evt.type === 'switched' || evt.type === 'threshold' || evt.type === 'reauth') {
        prependCompleted(evt);
      }
      renderActiveReqs();
    };
    // EventSource auto-reconnects on disconnect
  }

  setInterval(renderActiveReqs, 1000);
  connectActivity();

  // ── Logs panel ───────────────────────────────────────────────
  let logAutoScroll = true;
  logBoxEl.addEventListener('scroll', () => {
    logAutoScroll = logBoxEl.scrollHeight - logBoxEl.scrollTop - logBoxEl.clientHeight < 30;
  });

  document.getElementById('clearLogs').addEventListener('click', () => {
    logBoxEl.textContent = '';
  });

  function logLineClass(line) {
    const l = line.toLowerCase();
    if (l.includes('error') || l.includes('failed') || l.includes('exception') || l.includes('502') || l.includes('crash')) return 'log-err';
    if (l.includes('warn') || l.includes('429') || l.includes('throttl') || l.includes('rate limit')) return 'log-warn';
    return '';
  }

  function appendLog(line) {
    const cls = logLineClass(line);
    logBoxEl.appendChild(el('div', { class: 'log-line' + (cls ? ' ' + cls : ''), text: line }));
    while (logBoxEl.children.length > 500) logBoxEl.removeChild(logBoxEl.firstChild);
    if (logAutoScroll) logBoxEl.scrollTop = logBoxEl.scrollHeight;
  }

  function connectLogs() {
    const es = new EventSource('/teamclaude/logs');
    es.onmessage = (e) => appendLog(JSON.parse(e.data));
    // EventSource auto-reconnects, so no manual reconnect needed
  }

  connectLogs();

  // ── Boot ─────────────────────────────────────────────────────
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
