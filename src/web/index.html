<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamClaude Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23c87f3a' stroke-width='2.5'/><path d='M 16 5 A 11 11 0 0 1 27 16' fill='none' stroke='%23c87f3a' stroke-width='3' stroke-linecap='round'/><circle cx='16' cy='5' r='2.5' fill='%23c87f3a'/></svg>">
<style>
  :root {
    --bg: #faf7f2;
    --panel: #ffffff;
    --panel-border: #e8e1d4;
    --text: #2a2520;
    --text-dim: #7a7468;
    --accent: #b86a1a;
    --accent-soft: #c87f3a;
    --good: #4a7c4e;
    --warn: #c78a1f;
    --bad: #b04040;
    --bar-bg: #ece6d8;
    --bar-good: #5a9a5e;
    --bar-warn: #d4a035;
    --bar-bad: #c45050;
    --active-glow: rgba(184, 106, 26, 0.15);
    --log-bg: #f5f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1612;
      --panel: #251f18;
      --panel-border: #3a3128;
      --text: #ebe4d6;
      --text-dim: #8a8170;
      --accent: #e89030;
      --accent-soft: #d4801f;
      --good: #6abe6f;
      --warn: #e5b045;
      --bad: #d46060;
      --bar-bg: #312820;
      --bar-good: #5a9a5e;
      --bar-warn: #c89534;
      --bar-bad: #b04040;
      --active-glow: rgba(232, 144, 48, 0.18);
      --log-bg: #1e1810;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--panel-border);
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 .sub {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.95rem;
    margin-left: 0.5rem;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .threshold-row {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 0.875rem;
  }
  .threshold-row label { color: var(--text-dim); }
  .threshold-row input[type=range] {
    width: 180px;
    accent-color: var(--accent);
  }
  .threshold-row .val {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
    min-width: 3rem;
    text-align: right;
  }

  /* ── Buttons ── */
  button.switch, .btn-restart, .btn-ghost, .btn-danger {
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  button.switch {
    align-self: start;
    grid-row: 1;
    grid-column: 2;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.35rem 0.75rem;
  }
  button.switch:hover:not(:disabled) { background: var(--accent); color: #fff; }
  button.switch:disabled { opacity: 0.4; cursor: default; }
  .btn-restart {
    background: transparent;
    color: var(--bad);
    border: 1px solid var(--bad);
    padding: 0.32rem 0.7rem;
    font-size: 0.82rem;
  }
  .btn-restart:hover:not(:disabled) { background: var(--bad); color: #fff; }
  .btn-restart:disabled { opacity: 0.4; cursor: default; }
  .restart-status {
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    padding: 0.18rem 0.5rem;
    font-size: 0.75rem;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-svc {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.32rem 0.7rem;
    font-size: 0.82rem;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .btn-svc:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .btn-svc:disabled { opacity: 0.4; cursor: default; }

  /* ── Service bar ── */
  .svc {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.6rem 1.125rem;
    margin-bottom: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
  }
  .svc-stats {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.25rem 1.1rem;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .svc-stats .svc-title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .svc-stats b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .svc-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  /* ── Account cards ── */
  .cards { display: grid; gap: 0.875rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 1rem 1.125rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem 1rem;
    align-items: center;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 18px var(--active-glow);
  }
  .card.off { opacity: 0.55; }
  .card-actions {
    grid-row: 1;
    grid-column: 2;
    align-self: start;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card-actions .btn-ghost { padding: 0.3rem 0.6rem; font-size: 0.8rem; }

  /* ── Reauth panel (shown inside a card while a reauth session is pending) ── */
  .reauth-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 1px dashed var(--panel-border);
  }
  .reauth-panel .reauth-msg {
    flex-basis: 100%;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  .reauth-panel .reauth-msg a { color: var(--accent); }
  .reauth-panel input {
    flex: 1;
    min-width: 9rem;
    padding: 0.3rem 0.5rem;
    font: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--log-bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
  }
  .reauth-panel input:focus { outline: none; border-color: var(--accent); }
  .reauth-panel .btn-ghost { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  .card .name {
    font-size: 1.05rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card .name .badge {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--bar-bg);
    color: var(--text-dim);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .card.active .name .badge.active-badge { background: var(--accent); color: #fff; }
  .card .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    grid-column: 1 / -1;
  }
  .bars {
    display: grid;
    grid-template-columns: max-content 1fr max-content;
    column-gap: 0.625rem;
    row-gap: 0.4rem;
    align-items: center;
    grid-column: 1 / -1;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .bars .lbl { letter-spacing: 0.02em; }
  .bars .bar {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .bars .bar > span {
    display: block;
    height: 100%;
    background: var(--bar-good);
    transition: width 0.3s, background 0.3s;
    border-radius: 4px;
  }
  .bars .pct {
    font-variant-numeric: tabular-nums;
    min-width: 3rem;
    text-align: right;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.25;
  }
  .bars .pct .reset {
    font-size: 0.66rem;
    color: var(--text-dim);
    white-space: nowrap;
    cursor: help;
  }
  .bars .bar.warn > span { background: var(--bar-warn); }
  .bars .bar.bad > span { background: var(--bar-bad); }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--good);
  }
  .status-throttled { background: var(--warn); }
  .status-exhausted, .status-error { background: var(--bad); }

  /* ── Bottom panels ── */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 0.875rem;
    margin-top: 0.875rem;
  }
  @media (max-width: 740px) {
    .bottom-row { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .panel-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.625rem;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .active-count {
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ── Activity feed ── */
  #activeReqs { flex-shrink: 0; }
  .activity-item {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    padding: 0.22rem 0;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    min-width: 0;
  }
  .activity-item + .activity-item {
    border-top: 1px solid var(--panel-border);
  }
  .activity-sys { color: var(--text-dim); font-style: italic; }
  .act-dot {
    flex-shrink: 0;
    display: inline-block;
    width: 1.1rem;
    text-align: center;
    font-style: normal;
  }
  .act-dot-active { color: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .act-dot-ok  { color: var(--good); }
  .act-dot-warn { color: var(--warn); }
  .act-dot-bad  { color: var(--bad); }
  .act-dot-sys  { color: var(--text-dim); }
  .act-method {
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .act-path {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .act-account {
    color: var(--text-dim);
    font-size: 0.73rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 14ch;
    flex-shrink: 1;
  }
  .act-dur {
    color: var(--text-dim);
    font-size: 0.73rem;
    margin-left: auto;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .act-status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 700;
    min-width: 2.2rem;
  }
  .act-ok   { color: var(--good); }
  .act-warn { color: var(--warn); }
  .act-bad  { color: var(--bad); }
  .act-sep {
    height: 1px;
    background: var(--panel-border);
    margin: 0.4rem 0;
    flex-shrink: 0;
  }
  .completed-log {
    height: 260px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .completed-log:empty::before {
    content: 'No requests yet';
    display: block;
    text-align: center;
    padding: 2rem 0;
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  /* ── Logs panel ── */
  .log-box {
    height: 320px;
    overflow-y: auto;
    background: var(--log-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 0.5rem 0.625rem;
    font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
    font-size: 0.69rem;
    line-height: 1.6;
  }
  .log-box:empty::before {
    content: 'Connecting to log stream…';
    display: block;
    text-align: center;
    padding: 2rem 0;
    color: var(--text-dim);
    font-style: italic;
  }
  .log-line {
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text-dim);
  }
  .log-line.log-err  { color: var(--bad); }
  .log-line.log-warn { color: var(--warn); }

  /* ── Problems banner (only when something is wrong) ── */
  #problems { display: none; margin-bottom: 0.875rem; }
  #problems > div { padding: 0.55rem 1rem; border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.88rem; border: 1px solid; }
  #problems .bad  { color: var(--bad);  border-color: var(--bad);  background: color-mix(in srgb, var(--bad) 10%, transparent); }
  #problems .warn { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }

  /* ── Per-account block reason ── */
  .card .blocked { font-size: 0.8rem; color: var(--warn); margin: 0.1rem 0 0.35rem; }

  /* ── Status tables (routing, clients, dimensions, sessions) ── */

  /* ── Settings ── */
  details.settings > summary { cursor: pointer; list-style: none; }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings > summary .panel-title::before { content: "▸ "; color: var(--text-dim); }
  details.settings[open] > summary .panel-title::before { content: "▾ "; }
  .set-intro { font-size: 0.82rem; color: var(--text-dim); margin: 0.25rem 0 0.75rem; }
  .set-group { margin: 1rem 0 0.25rem; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
  .set-row { display: grid; grid-template-columns: minmax(10rem, 15rem) 1fr; gap: 0.25rem 1rem; padding: 0.45rem 0; border-bottom: 1px solid var(--panel-border); align-items: start; }
  .set-row label.k { font-size: 0.85rem; font-weight: 500; }
  .set-row .help { grid-column: 2; font-size: 0.76rem; color: var(--text-dim); }
  .set-row input[type=text], .set-row input[type=number], .set-row input[type=password], .set-row select, .set-row textarea {
    width: 100%; max-width: 32rem; box-sizing: border-box; font: inherit; font-size: 0.82rem; padding: 0.25rem 0.4rem;
    background: var(--log-bg); color: var(--text); border: 1px solid var(--panel-border); border-radius: 4px; }
  .set-row textarea { font-family: ui-monospace, monospace; min-height: 2.2rem; resize: vertical; }
  .set-row input[type=checkbox] { justify-self: start; margin: 0.3rem 0; }
  .set-row.dirty label.k::after { content: " •"; color: var(--accent); }
  .badge { display: inline-block; font-size: 0.66rem; padding: 0 0.35rem; margin-left: 0.35rem; border-radius: 3px; border: 1px solid var(--panel-border); color: var(--text-dim); vertical-align: middle; font-weight: 500; }
  .badge.restart { border-color: var(--warn); color: var(--warn); }
  .badge.danger { border-color: var(--bad); color: var(--bad); }
  .order-list { list-style: none; margin: 0; padding: 0; max-width: 40rem; }
  .order-list li { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.4rem; border: 1px solid var(--panel-border); border-radius: 6px; margin-bottom: 0.3rem; background: var(--log-bg); font-size: 0.85rem; }
  .order-list li .pos { color: var(--text-dim); width: 1.4rem; text-align: right; font-variant-numeric: tabular-nums; }
  .order-list li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-list li.off .nm { color: var(--text-dim); text-decoration: line-through; }
  .order-list details { width: 100%; }
  .acct-adv { padding: 0.25rem 0 0.25rem 1.9rem; }
  .ck-list .ck { display: flex; gap: 0.4rem; margin-bottom: 0.25rem; max-width: 32rem; }
  .ck-list .ck input { flex: 1; }
  .cl-pick { display: flex; flex-direction: column; gap: 0.2rem; max-width: 32rem; font-size: 0.82rem; }
  .cl-pick .cl-names { display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; padding-left: 1.2rem; }
  .cl-pick .cl-names.off { opacity: 0.45; }
  .cl-pick label { display: inline-flex; align-items: center; gap: 0.3rem; cursor: pointer; }
  .fam-panel { font-size: 0.8rem; margin: 0.2rem 0 0.6rem; max-width: 46rem; }
  .fam-panel table { border-collapse: collapse; width: 100%; margin-bottom: 0.4rem; }
  .fam-panel th, .fam-panel td { text-align: left; padding: 0.15rem 0.5rem 0.15rem 0; border-bottom: 1px solid var(--panel-border); font-variant-numeric: tabular-nums; }
  .fam-panel th { color: var(--text-dim); font-weight: 500; }
  .fam-panel .dim { color: var(--text-dim); }
  .set-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; position: sticky; bottom: 0; background: var(--panel); padding: 0.5rem 0; }
  .set-msg { font-size: 0.82rem; }
  .set-msg.bad { color: var(--bad); } .set-msg.good { color: var(--good); }
  .set-msg ul { margin: 0.25rem 0 0 1.1rem; padding: 0; }
  @media (max-width: 640px) { .set-row { grid-template-columns: 1fr; } .set-row .help { grid-column: 1; } }
  .tables { display: grid; gap: 0.875rem; margin-top: 0.875rem; }
  .tables .panel { overflow-x: auto; }
  table.st { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  table.st th { text-align: left; font-weight: 600; color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
  table.st td { padding: 0.32rem 0.5rem; border-bottom: 1px solid var(--panel-border); vertical-align: top; }
  table.st tr:last-child td { border-bottom: 0; }
  table.st .num { text-align: right; }
  table.st .dim { color: var(--text-dim); }
  table.st .tag { color: var(--text-dim); font-size: 0.75rem; margin-left: 0.35rem; }
  table.st .ok { color: var(--good); }
  table.st .no, table.st .badt { color: var(--bad); }
  table.st .warnt { color: var(--warn); }
  .filters { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.4rem; }
  .filters select { background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); border-radius: 4px; padding: 0.15rem 0.3rem; font: inherit; }

  /* ── Footer ── */
  .err {
    background: var(--bad);
    color: #fff;
    padding: 0.6rem 1rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  footer {
    margin-top: 1.25rem;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }

  /* ── Proxy key prompt (remote browsers; loopback never sees it) ── */
  #keybox { display: none; max-width: 420px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
  #keybox h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }
  #keybox p { color: var(--text-dim); font-size: 0.9rem; }
  #keybox input {
    width: 100%; padding: 0.6rem 0.75rem; margin: 0.9rem 0; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
    color: var(--text); font: inherit;
  }
  #keybox button {
    padding: 0.5rem 1.4rem; background: var(--accent); border: 0; border-radius: 6px;
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div id="keybox">
  <h1>TeamClaude</h1>
  <p>This proxy needs its API key (a <code>proxy.apiKey</code> or <code>proxy.clientKeys</code> key). It is kept in this browser's local storage for this address only.</p>
  <input type="password" id="keyInput" autocomplete="off" spellcheck="false" placeholder="proxy key">
  <button id="keyGo">Unlock</button>
</div>
<div class="wrap" id="app">
  <header>
    <h1>TeamClaude<span class="sub">multi-account proxy</span></h1>
    <div class="header-right">
      <div class="threshold-row">
        <label for="thr">Rotate at</label>
        <input type="range" id="thr" min="50" max="100" step="1" value="98">
        <span class="val" id="thrVal">98%</span>
      </div>
    </div>
  </header>

  <div id="errBox"></div>
  <div id="problems"></div>

  <!-- Service manager -->
  <div class="svc">
    <div class="svc-stats" id="svcStats"><span class="svc-title">Service</span></div>
    <div class="svc-actions">
      <span id="svcMsg" class="restart-status"></span>
      <button id="probeBtn" class="btn-svc" title="Re-read every account's quota from the zero-spend usage endpoint — use after a plan change or upgrade">↻ Refresh quotas</button>
      <button id="reloadBtn" class="btn-svc" title="Re-sync accounts from the config file without a restart (picks up new accounts, tokens, priorities)">⟲ Reload config</button>
      <button id="restartBtn" class="btn-restart" title="systemctl --user restart teamclaude">Restart</button>
      <span id="restartStatus" class="restart-status"></span>
    </div>
  </div>

  <div class="svc-stats" id="fleetLine" style="margin:-0.35rem 0 0.25rem 0.25rem"></div>
  <div id="failoverBanner" style="display:none;margin:0 0 0.875rem;padding:0.6rem 1rem;border-radius:8px;border:1px solid var(--bad);color:var(--bad);font-weight:600;background:var(--panel)"></div>
  <div class="set-intro" id="ruleLine" style="margin:0 0 0.875rem 0.25rem"></div>
  <div class="set-intro" id="fableNote" style="display:none;margin:-0.6rem 0 0.875rem 0.25rem;color:var(--warn)"></div>

  <div class="cards" id="cards"></div>

  <details class="panel settings" id="settingsWrap" style="margin-top:0.875rem">
    <summary class="panel-hdr"><span class="panel-title">Settings</span><span class="active-count" id="settingsNote"></span></summary>
    <div id="settingsBody"><div class="set-intro">Loading…</div></div>
  </details>

  <div class="tables">
    <div class="panel" id="routesWrap" style="display:none">
      <div class="panel-hdr"><span class="panel-title">Routing</span></div>
      <table class="st" id="routes"></table>
    </div>
    <div class="panel" id="clientsWrap" style="display:none">
      <div class="panel-hdr"><span class="panel-title">Clients</span></div>
      <table class="st" id="clients"></table>
    </div>
    <div id="dimensionsWrap" class="tables" style="margin-top:0"></div>
    <div class="panel" id="sessionsWrap" style="display:none">
      <div class="panel-hdr"><span class="panel-title">Sessions</span><span class="active-count" id="sessionCount"></span></div>
      <div class="filters">
        <label>Project <select id="fProject"></select></label>
        <label>Client <select id="fClient"></select></label>
      </div>
      <table class="st" id="sessions"></table>
    </div>
  </div>

  <div class="bottom-row">
    <!-- Activity panel -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="panel-title">Activity</span>
        <span id="activeCount" class="active-count"></span>
      </div>
      <div id="activeReqs"></div>
      <div class="act-sep" id="actSep" style="display:none"></div>
      <div class="completed-log" id="completedLog"></div>
    </div>

    <!-- Logs panel -->
    <div class="panel">
      <div class="panel-hdr">
        <span class="panel-title">Logs</span>
        <button id="clearLogs" class="btn-ghost">clear</button>
      </div>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>

  <footer>
    <span id="meta">Loading…</span>
  </footer>
</div>
<script>
// Shared, tested status helpers from src/dashboard.js — the same code the
// key-gated /teamclaude/dashboard runs. Injected by the server at this marker.
/*__TC_SHARED_HELPERS__*/
</script>
<script>
  // All DOM construction uses createElement + textContent — never innerHTML with untrusted data.

  const cardsEl     = document.getElementById('cards');
  const errEl       = document.getElementById('errBox');
  const metaEl      = document.getElementById('meta');
  const thr         = document.getElementById('thr');
  const thrVal      = document.getElementById('thrVal');
  const restartBtn  = document.getElementById('restartBtn');
  const restartStatusEl = document.getElementById('restartStatus');
  const svcStatsEl  = document.getElementById('svcStats');
  const svcMsgEl    = document.getElementById('svcMsg');
  const probeBtn    = document.getElementById('probeBtn');
  const reloadBtn   = document.getElementById('reloadBtn');
  const activeReqsEl = document.getElementById('activeReqs');
  const completedLogEl = document.getElementById('completedLog');
  const activeCountEl  = document.getElementById('activeCount');
  const actSepEl    = document.getElementById('actSep');
  const logBoxEl    = document.getElementById('logBox');

  let lastThreshold = null;
  let saveTimer = null;
  let restartPending = false;
  let wasDisconnected = false;

  // ── Proxy key ────────────────────────────────────────────────
  // Every call this page makes goes through api(), which attaches the stored
  // key as x-api-key (withKey, a shared helper). Loopback callers are exempt
  // from the key gate, so on the proxy's own host nothing is stored, nothing is
  // asked, and the page behaves as it always did. A remote browser gets a 401
  // on its first call, which brings up the prompt; a 401 later (key rotated or
  // removed) drops the stored key and asks again. The key never goes in a URL.
  const keyboxEl = document.getElementById('keybox');
  const appEl = document.getElementById('app');
  const keyInputEl = document.getElementById('keyInput');
  let needKey = false;
  // The key as entered this page load. Once set it is authoritative, so a
  // blocked or read-only localStorage (private windows, site-data policies,
  // a full quota still holding an old key) cannot make the page send anything
  // but what the operator just typed.
  let pageKey = '';

  function storedKey() {
    if (pageKey) return pageKey;
    try { return localStorage.getItem(KEY_STORAGE) || ''; } catch { return ''; }
  }
  // `sentKey` is the key the refused request carried. Requests are concurrent,
  // so a 401 can arrive after the operator has already entered a new key; only
  // a refusal of the key still in use may clear it.
  function onUnauthorized(sentKey) {
    if (sentKey !== storedKey()) return;
    pageKey = '';
    try { localStorage.removeItem(KEY_STORAGE); } catch { /* storage blocked */ }
    if (needKey) return;
    needKey = true;
    appEl.style.display = 'none';
    keyboxEl.style.display = 'block';
    keyInputEl.focus();
  }
  async function api(path, init) {
    const sent = storedKey();
    const res = await fetch(path, withKey(init, sent));
    if (res.status === 401) {
      onUnauthorized(sent);
      throw new Error('proxy key required');
    }
    return res;
  }
  function unlock() {
    const v = keyInputEl.value.trim();
    if (!v) return;
    pageKey = v;
    try { localStorage.setItem(KEY_STORAGE, v); } catch { /* storage blocked: pageKey carries it for this page */ }
    keyInputEl.value = '';
    needKey = false;
    keyboxEl.style.display = 'none';
    appEl.style.display = '';
    refresh();
    connectActivity();
    connectLogs();
  }
  document.getElementById('keyGo').addEventListener('click', unlock);
  keyInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

  // An event stream read with fetch, since EventSource cannot send x-api-key.
  // Reconnects like EventSource does (a few seconds after the stream ends or
  // the network drops), stops on 401 until the key is entered (unlock()
  // reconnects), and stops for good on 501 — the server's "this host cannot
  // serve the stream" answer — rather than respawning a doomed request.
  // Returns { stop }; reconnecting a stream stops the previous one first, so
  // unlock() never leaves two readers on one feed.
  function openStream(path, { onOpen, onData, onUnavailable }) {
    let stopped = false;
    const ctl = new AbortController();
    const retry = (ms) => { if (!stopped) setTimeout(run, ms); };
    async function run() {
      if (stopped || needKey) return;
      let res;
      try {
        res = await api(path, { cache: 'no-store', headers: { accept: 'text/event-stream' }, signal: ctl.signal });
      } catch {
        if (!needKey) retry(3000);
        return;
      }
      if (res.status === 501) {
        stopped = true;
        const data = await res.json().catch(() => ({}));
        onUnavailable?.(data.error || 'not available on this host');
        return;
      }
      if (!res.ok || !res.body) { retry(10000); return; }
      onOpen?.();
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      try {
        for (;;) {
          const { value, done } = await reader.read();
          // At the end, flush the decoder and let a held-back CR count.
          const parsed = done
            ? sseFrames(buf + decoder.decode(), true)
            : sseFrames(buf + decoder.decode(value, { stream: true }));
          buf = parsed.rest;
          for (const data of parsed.events) {
            try { onData(JSON.parse(data)); } catch { /* one bad frame must not end the stream */ }
          }
          if (done) break;
        }
      } catch { /* dropped mid-stream, or stopped: reconnect below unless stopped */ }
      retry(3000);
    }
    run();
    return { stop() { stopped = true; ctl.abort(); } };
  }

  // ── DOM builder ──────────────────────────────────────────────
  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'style') node.style.cssText = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('data-')) node.setAttribute(k, v);
      else if (k === 'disabled' && v) node.disabled = true;
      else node.setAttribute(k, v);
    }
    for (const child of (Array.isArray(children) ? children : [children])) {
      if (child == null || child === false) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  // ── Formatters ───────────────────────────────────────────────
  function fmtPct(v) { return v == null ? '—' : (v * 100).toFixed(0) + '%'; }
  function fmtNum(n) { return n.toLocaleString(); }
  function fmtAgo(iso) {
    if (!iso) return 'never';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function fmtMs(ms) {
    if (ms == null) return '—';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }
  function fmtUptime(s) {
    if (s == null) return '—';
    if (s < 3600) return Math.floor(s / 60) + 'm';
    if (s < 86400) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    return Math.floor(s / 86400) + 'd ' + Math.floor((s % 86400) / 3600) + 'h';
  }
  function fmtMB(bytes) { return bytes == null ? '—' : Math.round(bytes / 1048576) + ' MB'; }
  // Quota windows carry a reset timestamp (ms epoch for unified, ISO for standard).
  // Returns { when, rel, full } or null when the window is already reset / absent.
  function fmtReset(ts) {
    if (ts == null) return null;
    const t = typeof ts === 'number' ? ts : new Date(ts).getTime();
    if (!t || isNaN(t) || t <= Date.now()) return null;
    const d = new Date(t);
    const diffMin = Math.round((t - Date.now()) / 60000);
    const rel = diffMin < 60 ? diffMin + 'm'
      : diffMin < 1440 ? Math.round(diffMin / 60) + 'h'
      : Math.round(diffMin / 1440) + 'd';
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const sameDay = d.toDateString() === new Date().toDateString();
    const when = sameDay ? time : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
    return { when, rel, full: d.toLocaleString() };
  }
  function shortPath(path) {
    return (path || '').replace(/^\/(v1|api)\//, '').split('?')[0] || path;
  }
  function barClass(util, threshold) {
    if (util == null) return 'bar';
    if (util >= threshold) return 'bar bad';
    if (util >= threshold * 0.7) return 'bar warn';
    return 'bar';
  }

  // ── Account cards ────────────────────────────────────────────
  // Fable and Sonnet meter their own weekly quota on top of the shared 5h/7d
  // buckets, and selection skips an account whose family bucket is spent — for
  // that model only. Without these bars a card can read "95%, active" while
  // every Fable request bounces off it. Returns [] for plans that don't report
  // a family bucket, so those cards keep the plain 5h/7d pair.
  function familyBuckets(q) {
    if (!q) return [];
    const out = [
      { key: 'unified7dFable', family: 'fable', label: '7d fable' },
      { key: 'unified7dSonnet', family: 'sonnet', label: '7d sonnet' },
    ]
      .filter(f => q[f.key] != null)
      .map(f => ({ family: f.family, label: f.label, util: q[f.key], reset: q[f.key + 'Reset'] ?? null }));
    // Families learned from the usage payload's `limits` array (scopedWeekly):
    // upstream can meter a third family before this page knows its name.
    const scoped = q.scopedWeekly || {};
    for (const fam of Object.keys(scoped).sort()) {
      if (out.some(f => f.family === fam)) continue;
      const b = scoped[fam] || {};
      if (b.utilization == null) continue;
      out.push({ family: fam, label: '7d ' + fam, util: b.utilization, reset: b.resetAt ?? null });
    }
    return out.map(({ label, util, reset }) => ({ label, util, reset }));
  }

  function makeBar(label, util, threshold, resetTs) {
    const inner = el('span', { style: 'width:' + (util == null ? 0 : Math.min(100, util * 100)) + '%' });
    const r = fmtReset(resetTs);
    const pct = el('span', { class: 'pct' }, [
      el('span', { text: fmtPct(util) }),
      r ? el('span', { class: 'reset', title: 'resets ' + r.full + ' (in ' + r.rel + ')', text: '↺ ' + r.when }) : null,
    ]);
    return [
      el('span', { class: 'lbl', text: label }),
      el('div', { class: barClass(util, threshold) }, inner),
      pct,
    ];
  }

  function renderAccount(acct, isActive, threshold, mixedProviders, rank) {
    const q = acct.quota;
    const u5h = q.unified5h != null ? q.unified5h
      : (q.tokensLimit ? 1 - q.tokensRemaining / q.tokensLimit : null);
    const u7d = q.unified7d;
    // Cache read/write included: uncached input alone understates Claude Code
    // traffic by orders of magnitude (shared accountTokens helper).
    const totalTok = accountTokens(acct.usage);
    const recent = Number.isFinite(acct.sessions) ? acct.sessions : 0;
    const known = Number.isFinite(acct.knownSessions) ? acct.knownSessions : 0;

    const inFlight = acct.inFlight || 0;
    const nameRow = el('div', { class: 'name' }, [
      el('span', { class: 'status-dot status-' + acct.status }),
      acct.name,
      isActive ? el('span', { class: 'badge active-badge', text: 'active' }) : null,
      acct.disabled ? el('span', { class: 'badge', style: 'background:transparent;color:var(--bad);border:1px solid var(--bad);', text: 'disabled' }) : null,
      inFlight > 0 ? el('span', { class: 'badge', style: 'background:transparent;color:var(--accent,#4a9eff);', text: inFlight + ' live' }) : null,
      // A spent family bucket bars only that model family, so the account stays
      // "active" and under the shared threshold — name it, or the card looks
      // healthy while requests for that family keep switching away.
      ...familyBuckets(q).filter(f => f.util >= threshold).map(f => el('span', {
        class: 'badge', style: 'background:transparent;color:var(--warn,#e0a030);border:1px solid var(--warn,#e0a030);',
        title: f.label.replace('7d ', '') + ' weekly quota is spent — this account is skipped for '
          + f.label.replace('7d ', '') + ' requests only; other models still route here',
        text: f.label.replace('7d ', '') + ' spent',
      })),
      el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', text: acct.type }),
      mixedProviders ? el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', text: providerLabel(acct.provider) }) : null,
      rank && rank.mode === 'expiry'
        ? el('span', { class: 'badge', style: 'background:transparent;color:var(--accent);border:1px solid var(--accent);', title: 'expiry pressure: weekly allowance left per hour until it resets (higher = more to lose, used first)', text: rank.pressurePerHour == null ? 'pressure ?' : 'pressure ' + (rank.pressurePerHour * 100).toFixed(2) + '%/h' })
        : el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', title: 'rotation priority (lower is preferred)', text: 'prio ' + (acct.priority || 0) }),
      recent ? el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', title: 'sessions that used this account recently', text: recent + ' recent' }) : null,
      known > recent ? el('span', { class: 'badge', style: 'background:transparent;color:var(--text-dim);', title: 'sessions pinned to this account', text: known + ' known' }) : null,
    ]);
    // Why selection is skipping this account right now (null = it can serve).
    const blocked = acct.unavailable
      ? el('div', { class: 'blocked', text: 'blocked: ' + (UNAVAILABLE_TEXT[acct.unavailable] || acct.unavailable) })
      : null;
    const actions = el('div', { class: 'card-actions' }, [
      el('button', { class: 'switch', 'data-name': acct.name, disabled: isActive || acct.disabled, text: 'Switch' }),
      el('button', {
        class: 'btn-ghost toggle-acct', 'data-name': acct.name, 'data-disabled': acct.disabled ? '1' : '',
        title: acct.disabled ? 'Bring this account back into rotation (also clears a stuck error)' : 'Exclude this account from rotation',
        text: acct.disabled ? 'Enable' : 'Disable',
      }),
      acct.type === 'oauth' ? el('button', {
        class: 'btn-ghost reauth-acct', 'data-name': acct.name,
        title: 'Re-run the browser OAuth login for this account (fixes a revoked refresh token). Log into claude.ai as this account before approving.',
        text: 'Reauth',
      }) : null,
    ]);
    const families = familyBuckets(q);
    const bars = el('div', { class: 'bars' }, [
      ...makeBar('5h', u5h, threshold, q.unified5hReset ?? q.resetsAt),
      ...makeBar('7d', u7d, threshold, q.unified7dReset),
      ...families.flatMap(f => makeBar(f.label, f.util, threshold, f.reset)),
    ]);
    const metaText = fmtNum(acct.usage.totalRequests) + ' requests · '
      + fmtNum(totalTok) + ' tokens · last used ' + fmtAgo(acct.usage.lastUsed)
      + (acct.rateLimitedUntil ? ' · throttled until ' + new Date(acct.rateLimitedUntil).toLocaleTimeString() : '');
    const meta = el('div', { class: 'meta', text: metaText });
    return el('div', { class: 'card' + (isActive ? ' active' : '') + (acct.disabled ? ' off' : ''), 'data-name': acct.name }, [nameRow, actions, blocked, bars, meta]);
  }

  // ── Error display ────────────────────────────────────────────
  function showErr(msg) {
    errEl.textContent = '';
    if (msg) errEl.appendChild(el('div', { class: 'err', text: msg }));
  }

  // ── Fleet status panels (shared helpers from src/dashboard.js) ──
  let lastStatus = null;
  const sessionFilters = { project: '', client: '' };
  function td(text, cls) { return el('td', cls ? { class: cls, text } : { text }); }
  function th(text, num) { return el('th', num ? { class: 'num', text } : { text }); }
  function fmtAgoTs(v) { return v ? fmtAgo(typeof v === 'number' ? new Date(v).toISOString() : v) : '—'; }

  // Who is current per provider, and how many sessions are live.
  function renderFleetLine(s) {
    const line = document.getElementById('fleetLine');
    line.textContent = '';
    const cur = s.currentAccounts || null;
    const providers = cur ? Object.keys(cur).sort((a, b) => a === 'anthropic' ? -1 : b === 'anthropic' ? 1 : a.localeCompare(b)) : [];
    line.appendChild(el('span', { class: 'svc-title', text: 'Fleet' }));
    if (providers.length > 1) {
      for (const p of providers) line.appendChild(el('span', {}, [providerLabel(p) + ' current ', el('b', { text: cur[p] || 'none' })]));
    } else {
      line.appendChild(el('span', {}, ['current ', el('b', { text: s.currentAccount || 'none' })]));
    }
    const sess = s.sessions || {};
    line.appendChild(el('span', {}, ['sessions ', el('b', { text: (sess.active || 0) + ' active / ' + (sess.known || 0) + ' known' })]));
    const view = rotationView(s);
    line.appendChild(el('span', { title: view.rule }, ['routing ', el('b', { text: view.mode === 'expiry' ? 'expires first' : 'strict list order' })]));
    const ruleEl = document.getElementById('ruleLine');
    if (ruleEl) ruleEl.textContent = view.rule;
    // Fable / Mythos rationing (<family>.allow): today's rewrites and fallbacks
    // in one line each, so JP sees when his own Fable or Mythos became Opus.
    for (const [name, fb] of [['Fable', s.fable || {}], ['Mythos', s.mythos || {}]]) {
      if (!fb.enabled) continue;
      line.appendChild(el('span', { title: name + ' allowed for: ' + ((fb.allow || []).join(', ') || 'nobody') + '. Everyone else is served as ' + fb.model + '.' },
        [name + ' ', el('b', { text: (fb.rewritten || 0) + ' rewritten to ' + String(fb.model || 'Opus').replace(/^claude-/, '') + ' today · ' + (fb.fallbacks || 0) + ' fallbacks' })]));
    }
    // Local-model failover: state on the fleet line, and a banner while active.
    const fo = s.failover || {};
    if (fo.enabled) {
      line.appendChild(el('span', { title: 'When no Claude account can serve, requests go to the local model ' + fo.model + '.' },
        ['failover ', el('b', { text: (fo.active ? 'ACTIVE' : 'ready') + ' · ' + (fo.served || 0) + ' served' })]));
    }
    const foBanner = document.getElementById('failoverBanner');
    if (foBanner) {
      foBanner.textContent = fo.active ? 'FAILOVER: no Claude account can serve — agents are on the local model (' + fo.model + '), slower and weaker. ' + (fo.served || 0) + ' requests served' + (fo.since ? ' since ' + new Date(fo.since).toLocaleTimeString() : '') + '. Claude takes over again as soon as an account can serve.' : '';
      foBanner.style.display = fo.active ? '' : 'none';
    }
    // The latest fallback of either family (Fable or Mythos), named by family.
    const fbNote = document.getElementById('fableNote');
    if (fbNote) {
      const lf = [['Fable', s.fable], ['Mythos', s.mythos]]
        .filter(([, f]) => f && f.enabled && f.lastFallback)
        .map(([family, f]) => ({ family, ...f.lastFallback }))
        .sort((a, b) => String(b.at).localeCompare(String(a.at)))[0] || null;
      fbNote.textContent = lf ? lf.family + ' fell back to ' + lf.to + ' at ' + new Date(lf.at).toLocaleTimeString() + ' for ' + (lf.client || '(shared key)') + ': ' + lf.reason + '.' : '';
      fbNote.style.display = lf ? '' : 'none';
    }
    const w = s.warm || {};
    if (w.enabled) {
      const how = [w.intervalSeconds ? 'every ' + w.intervalSeconds + 's' : null, w.onExhaustion ? 'align' : null].filter(Boolean).join(' + ') || 'on';
      line.appendChild(el('span', {}, ['keep-warm ', el('b', { text: how + (w.lastTrigger ? ' · last ' + w.lastTrigger.split('@')[0] : '') })]));
    }
  }

  // Top of the page and only when something is wrong.
  function renderProblems(s) {
    const wrap = document.getElementById('problems');
    const list = problems(s);
    wrap.textContent = '';
    wrap.style.display = list.length ? 'block' : 'none';
    for (const p of list) wrap.appendChild(el('div', { class: p.severity, text: p.text }));
  }

  // Where each metered family goes right now, and which accounts could take it.
  function renderRoutes(s) {
    const wrap = document.getElementById('routesWrap');
    const rows = routeRows(s);
    if (!rows.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const table = document.getElementById('routes');
    table.textContent = '';
    table.appendChild(el('tr', {}, [th('Family'), th('Goes to'), th('Can serve it')]));
    for (const r of rows) {
      const fam = el('td', {}, [r.label, r.match ? el('span', { class: 'tag', text: r.match }) : null]);
      const to = el('td', r.blocked ? { class: 'badt' } : {}, [r.blocked ? 'blocked' : (r.target || '—')]);
      if (r.pinned) to.appendChild(el('span', { class: 'tag', text: ' · pinned to ' + r.pinned }));
      if (r.pinMismatch) to.appendChild(el('span', { class: 'warnt', text: ' (not eligible)' }));
      if (r.kind === 'default' && r.target !== r.current) {
        to.appendChild(el('span', { class: 'warnt', text: r.currentUnavailable
          ? ' · current account ' + r.current + ' is blocked: ' + (UNAVAILABLE_TEXT[r.currentUnavailable] || r.currentUnavailable)
          : ' · outranks the current account ' + r.current }));
      }
      let can;
      if (r.kind === 'default') can = td('no route of its own', 'dim');
      else if (r.blocked || (!r.eligible.length && !r.ineligible.length)) can = td('—');
      else can = el('td', {}, [
        el('span', { class: 'ok', text: r.eligible.length + ' of ' + (r.eligible.length + r.ineligible.length) + (r.ineligible.length ? ' ' : '') }),
        r.ineligible.length ? el('span', { class: 'no', text: r.ineligible.join(', ') }) : null,
      ]);
      table.appendChild(el('tr', {}, [fam, to, can]));
    }
  }

  // Per-client usage (proxy.clientKeys); hidden when no client has been seen.
  function renderClients(clients) {
    const wrap = document.getElementById('clientsWrap');
    const names = Object.keys(clients || {});
    if (!names.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const tot = c => (c.inputTokens || 0) + (c.outputTokens || 0);
    names.sort((a, b) => tot(clients[b]) - tot(clients[a]));
    const table = document.getElementById('clients');
    table.textContent = '';
    table.appendChild(el('tr', {}, [th('Client'), th('Requests', 1), th('WebSockets', 1), th('Input tok', 1), th('Output tok', 1), th('Last used', 1)]));
    for (const n of names) {
      const c = clients[n];
      table.appendChild(el('tr', {}, [td(n), td(fmtNum(c.requests || 0), 'num'), td(fmtNum(c.connections || 0), 'num'),
        td(fmtNum(c.inputTokens || 0), 'num'), td(fmtNum(c.outputTokens || 0), 'num'), td(fmtAgoTs(c.lastUsed), 'num')]));
    }
  }

  // One table per configured usage dimension (proxy.usageDimensions).
  function renderDimensions(dimensions) {
    const wrap = document.getElementById('dimensionsWrap');
    wrap.textContent = '';
    for (const name of Object.keys(dimensions || {})) {
      const entries = dimensions[name] || {};
      const rows = sortRows(Object.keys(entries).map(key => {
        const e = entries[key] || {};
        return { name: key, requests: e.requests || 0, inputTokens: e.inputTokens || 0, outputTokens: e.outputTokens || 0, lastUsed: e.lastUsed ? Date.parse(e.lastUsed) : 0 };
      }), 'inputTokens', 'desc');
      if (!rows.length) continue;
      const title = name.charAt(0).toUpperCase() + name.slice(1);
      const table = el('table', { class: 'st' }, [el('tr', {}, [th(title), th('Req', 1), th('Input tok', 1), th('Output tok', 1), th('Last used', 1)])]);
      for (const r of rows) {
        table.appendChild(el('tr', {}, [td(r.name), td(fmtNum(r.requests), 'num'), td(fmtNum(r.inputTokens), 'num'), td(fmtNum(r.outputTokens), 'num'), td(fmtAgoTs(r.lastUsed), 'num')]));
      }
      wrap.appendChild(el('div', { class: 'panel' }, [el('div', { class: 'panel-hdr' }, [el('span', { class: 'panel-title', text: title })]), table]));
    }
  }

  // Per-session detail; present only when proxy.sessionDetail is on.
  function fillSelect(select, values, key) {
    const keep = sessionFilters[key];
    select.textContent = '';
    select.appendChild(el('option', { value: '', text: 'all' }));
    for (const v of values) select.appendChild(el('option', { value: v, text: v }));
    select.value = values.includes(keep) ? keep : '';
    sessionFilters[key] = select.value;
  }
  function renderSessions(sessions) {
    const wrap = document.getElementById('sessionsWrap');
    if (!sessions || !sessions.items) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const all = sessionRows(sessions);
    fillSelect(document.getElementById('fProject'), uniqSorted(all.map(r => r.project)), 'project');
    fillSelect(document.getElementById('fClient'), uniqSorted(all.map(r => r.client)), 'client');
    const rows = sortRows(filterSessionRows(all, sessionFilters), 'lastSeen', 'desc');
    document.getElementById('sessionCount').textContent = rows.length + ' of ' + all.length;
    const table = document.getElementById('sessions');
    table.textContent = '';
    table.appendChild(el('tr', {}, [th('Session'), th('Client'), th('Project'), th('Accounts'), th('Req', 1), th('Cache read', 1),
      th('Cache write', 1), th('Input', 1), th('Output', 1), th('Context', 1), th('Last seen', 1)]));
    for (const r of rows) {
      table.appendChild(el('tr', {}, [td(String(r.id).slice(0, 8) + (r.active ? '' : ' ·idle'), r.active ? '' : 'dim'), td(r.client || '—'), td(r.project || '—'),
        td(r.accounts || '—'), td(fmtNum(r.requests), 'num'), td(fmtNum(r.cacheRead), 'num'), td(fmtNum(r.cacheCreation), 'num'),
        td(fmtNum(r.input), 'num'), td(fmtNum(r.output), 'num'), td(fmtNum(r.context), 'num'), td(fmtAgoTs(r.lastSeen), 'num')]));
    }
  }
  for (const [id, key] of [['fProject', 'project'], ['fClient', 'client']]) {
    document.getElementById(id).addEventListener('change', e => {
      sessionFilters[key] = e.target.value;
      if (lastStatus) renderSessions(lastStatus.sessions);
    });
  }

  // ── Status poll ──────────────────────────────────────────────
  async function refresh() {
    try {
      const res = await api('/teamclaude/status', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (restartPending && wasDisconnected) {
        restartPending = false;
        restartStatusEl.textContent = 'Restarted ✓';
        restartBtn.disabled = false;
        setTimeout(() => { restartStatusEl.textContent = ''; }, 4000);
      }
      wasDisconnected = false;
      showErr('');

      const serverPct = Math.round(data.switchThreshold * 100);
      if (lastThreshold !== serverPct && document.activeElement !== thr) {
        thr.value = serverPct;
        thrVal.textContent = serverPct + '%';
        lastThreshold = serverPct;
      }

      // Cards are rebuilt every poll; the reauth panel is a singleton element
      // re-attached afterwards so a half-typed code (and focus) survives.
      const reauthHadFocus = document.activeElement === reauthCodeEl;
      cardsEl.textContent = '';
      // Cards follow the order traffic follows (shared rotationView): live
      // expiry pressure when expiry routing is on, else priority then list
      // position — so the top card is where the next new session goes.
      const view = rotationView(data);
      const ordered = view.accounts.map(x => x.account);
      const rankOf = new Map(view.accounts.map(x => [x.account.name, { mode: view.mode, pressurePerHour: x.pressurePerHour }]));
      // A mixed Claude/Codex fleet has one current account per provider.
      const currents = data.currentAccounts || null;
      const isCurrent = a => currents ? currents[a.provider] === a.name : a.name === data.currentAccount;
      const mixed = new Set(data.accounts.map(a => a.provider || 'anthropic')).size > 1;
      for (const acct of ordered) {
        cardsEl.appendChild(renderAccount(acct, isCurrent(acct), data.switchThreshold, mixed, rankOf.get(acct.name)));
      }
      attachReauthPanel(reauthHadFocus);
      lastStatus = data;
      renderFleetLine(data);
      renderProblems(data);
      renderRoutes(data);
      renderClients(data.clients);
      renderDimensions(data.usageDimensions);
      renderSessions(data.sessions);

      const sv = data.server || {};
      svcStatsEl.textContent = '';
      svcStatsEl.appendChild(el('span', { class: 'svc-title', text: 'Service' }));
      for (const [label, value] of [
        ['version', sv.version ? 'v' + sv.version : '—'],
        ['uptime', fmtUptime(sv.uptimeSeconds)],
        ['memory', fmtMB(sv.rssBytes)],
        ['pid', sv.pid != null ? String(sv.pid) : '—'],
        ['port', String(sv.port || 3456)],
        ['accounts', data.accounts.filter(a => !a.disabled).length + '/' + data.accounts.length + ' in rotation'],
      ]) {
        svcStatsEl.appendChild(el('span', {}, [label + ' ', el('b', { text: value })]));
      }

      const upDisplay = (sv.upstream || 'api.anthropic.com').replace(/^https?:\/\//, '');
      const portDisplay = sv.port || 3456;
      metaEl.textContent = `Active: ${data.currentAccount} · ${upDisplay}:${portDisplay} · ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      wasDisconnected = true;
      if (!restartPending) {
        showErr('Cannot reach proxy: ' + err.message);
      }
      metaEl.textContent = 'Disconnected';
    }
  }

  // ── Account actions (switch / enable / disable) ──────────────
  cardsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button.switch, button.toggle-acct');
    if (!btn || btn.disabled) return;
    const name = btn.getAttribute('data-name');
    const isToggle = btn.classList.contains('toggle-acct');
    btn.disabled = true;
    try {
      const res = isToggle
        ? await api('/teamclaude/account', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
            body: JSON.stringify({ name, disabled: !btn.getAttribute('data-disabled') }),
          })
        : await api('/teamclaude/switch', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
            body: JSON.stringify({ account: name }),
          });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'HTTP ' + res.status);
      }
      await refresh();
    } catch (err) {
      showErr((isToggle ? 'Account toggle' : 'Switch') + ' failed: ' + err.message);
      btn.disabled = false;
    }
  });

  // ── Reauth flow (per-account browser OAuth re-login) ─────────
  // One session at a time, mirroring the server. The panel lives inside the
  // pending account's card: a status line with a fallback link to the authorize
  // page, plus a paste-code input for when the localhost callback can't reach
  // the proxy host (e.g. dashboard opened from another machine).
  const reauthCtl = { account: null, timer: null };
  const reauthMsgEl = el('span', { class: 'reauth-msg' });
  const reauthCodeEl = el('input', { type: 'text', placeholder: 'paste code or callback URL', spellcheck: 'false' });
  const reauthSubmitEl = el('button', { class: 'btn-ghost', text: 'Submit' });
  const reauthCancelEl = el('button', { class: 'btn-ghost', text: 'Cancel' });
  const reauthPanel = el('div', { class: 'reauth-panel' }, [reauthMsgEl, reauthCodeEl, reauthSubmitEl, reauthCancelEl]);

  function attachReauthPanel(hadFocus) {
    if (!reauthCtl.account) return;
    for (const card of cardsEl.children) {
      if (card.getAttribute('data-name') === reauthCtl.account) {
        card.appendChild(reauthPanel);
        if (hadFocus) reauthCodeEl.focus();
        return;
      }
    }
  }

  function stopReauth() {
    reauthCtl.account = null;
    if (reauthCtl.timer) { clearInterval(reauthCtl.timer); reauthCtl.timer = null; }
    reauthPanel.remove();
    reauthCodeEl.value = '';
  }

  function handleReauthStatus(st) {
    if (!reauthCtl.account) return;
    if (st.state === 'done') {
      flashSvcMsg('✓ reauthed ' + (st.email || st.account));
      stopReauth();
      refresh();
    } else if (st.state === 'error') {
      showErr('Reauth failed: ' + (st.error || 'unknown error'));
      stopReauth();
    } else if (st.state === 'idle') {
      stopReauth(); // cancelled elsewhere, or the service restarted
    }
    // 'pending' → keep waiting
  }

  async function pollReauth() {
    if (!reauthCtl.account) return;
    try {
      const res = await api('/teamclaude/reauth', { cache: 'no-store' });
      if (res.ok) handleReauthStatus(await res.json());
    } catch { /* transient — keep polling */ }
  }

  async function startReauth(btn, name) {
    // Open the tab synchronously (inside the click's user activation) so popup
    // blockers allow it; point it at the authorize URL once the server answers.
    const tab = window.open('about:blank', '_blank');
    btn.disabled = true;
    try {
      const res = await api('/teamclaude/reauth', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      if (tab) tab.location = data.authUrl;
      showErr('');
      reauthCtl.account = name;
      reauthCodeEl.value = '';
      reauthMsgEl.textContent = '';
      reauthMsgEl.append(
        'Approve in the ',
        el('a', { href: data.authUrl, target: '_blank', text: 'login page' }),
        ' while logged into claude.ai as ' + name + ' — or paste the code it shows:',
      );
      attachReauthPanel(false);
      if (!reauthCtl.timer) reauthCtl.timer = setInterval(pollReauth, 2000);
    } catch (err) {
      if (tab) tab.close();
      showErr('Reauth failed: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function submitReauthCode() {
    const code = reauthCodeEl.value.trim();
    if (!code) return;
    reauthSubmitEl.disabled = true;
    try {
      const res = await api('/teamclaude/reauth/code', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
        body: JSON.stringify({ code }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      handleReauthStatus(data);
    } catch (err) {
      showErr('Reauth code submit failed: ' + err.message);
    } finally {
      reauthSubmitEl.disabled = false;
    }
  }

  reauthSubmitEl.addEventListener('click', submitReauthCode);
  reauthCodeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitReauthCode(); });
  reauthCancelEl.addEventListener('click', async () => {
    try {
      await api('/teamclaude/reauth/cancel', { method: 'POST', headers: { 'x-teamclaude-control': '1' } });
    } catch { /* the server may be gone; reset the UI regardless */ }
    stopReauth();
  });

  cardsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button.reauth-acct');
    if (!btn || btn.disabled) return;
    startReauth(btn, btn.getAttribute('data-name'));
  });

  // ── Service actions: refresh quotas / reload config ──────────
  function flashSvcMsg(text) {
    svcMsgEl.textContent = text;
    setTimeout(() => { if (svcMsgEl.textContent === text) svcMsgEl.textContent = ''; }, 4000);
  }
  async function svcAction(btn, url, describe) {
    btn.disabled = true;
    try {
      const res = await api(url, { method: 'POST', headers: { 'x-teamclaude-control': '1' } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      await refresh();
      flashSvcMsg(describe(data));
    } catch (err) {
      showErr('Service action failed: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }
  probeBtn.addEventListener('click', () =>
    svcAction(probeBtn, '/teamclaude/probe', d => '✓ probed ' + d.probed + ' account' + (d.probed === 1 ? '' : 's')));
  reloadBtn.addEventListener('click', () =>
    svcAction(reloadBtn, '/teamclaude/reload', d => d.added ? '✓ +' + d.added + ' account' + (d.added === 1 ? '' : 's') : '✓ config re-synced'));

  // ── Threshold slider ─────────────────────────────────────────
  thr.addEventListener('input', () => { thrVal.textContent = thr.value + '%'; });
  thr.addEventListener('change', () => {
    clearTimeout(saveTimer);
    const value = Number(thr.value) / 100;
    saveTimer = setTimeout(async () => {
      try {
        const res = await api('/teamclaude/threshold', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' },
          body: JSON.stringify({ value }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'HTTP ' + res.status);
        }
        lastThreshold = Math.round(value * 100);
      } catch (err) {
        showErr('Threshold update failed: ' + err.message);
      }
    }, 100);
  });

  // ── Settings view ────────────────────────────────────────────
  // Built from GET /teamclaude/settings, which describes every config key
  // (group, help, default, hot or restart). Rendered when the panel opens and
  // after a save — never on the status poll, so a half-typed value survives.
  // Only changed fields are sent. Secrets arrive masked and a masked value
  // sent back means "keep it", so the page can replace a secret, never read it.
  const settingsWrap = document.getElementById('settingsWrap');
  const settingsBody = document.getElementById('settingsBody');
  const settingsNote = document.getElementById('settingsNote');
  let settingsData = null;
  let settingsOrder = null;     // account ids, top = priority 0
  let settingsAcctDirty = {};   // id → { field: value }
  let settingsConfirm = false;  // second click needed to save a danger change

  const showDef = (v) => v === null || v === undefined ? 'none' : typeof v === 'object' ? JSON.stringify(v) : String(v);

  function settingsInput(f, value, canEdit, onChange) {
    const dis = !canEdit;
    const mask = settingsData.mask;
    let input; let read;
    switch (f.type) {
      case 'bool':
        input = el('input', { type: 'checkbox', disabled: dis });
        input.checked = value ?? f.def ?? false;
        read = () => input.checked;
        break;
      case 'int': case 'number':
        input = el('input', { type: 'number', step: f.type === 'int' ? '1' : 'any', min: f.min, max: f.max, placeholder: showDef(f.def), disabled: dis });
        input.value = value ?? '';
        read = () => input.value === '' ? null : Number(input.value);
        break;
      case 'enum':
        input = el('select', { disabled: dis }, f.options.map(o => el('option', { value: JSON.stringify(o), text: String(o) })));
        input.value = JSON.stringify(value ?? f.def);
        read = () => JSON.parse(input.value);
        break;
      case 'secret':
        input = el('input', { type: 'password', autocomplete: 'new-password', placeholder: value ? 'set — type to replace' : 'not set', disabled: dis });
        input.value = value ? mask : '';
        read = () => input.value;
        break;
      case 'list':
        input = el('textarea', { rows: 2, placeholder: 'one per line', disabled: dis });
        input.value = Array.isArray(value) ? value.join('\n') : (value ?? '');
        read = () => input.value.split(/\n/).map(s => s.trim()).filter(Boolean);
        break;
      case 'clients': {
        // A switch ("ration this family") above one checkbox per client name.
        // Off = no list: everyone may use it. On with nothing ticked = nobody.
        // Names come from the server (client key NAMES only); a name already in
        // the config that is no longer a client key stays listed so it is visible.
        // An entry that is not a configured name arrives masked as "(not a client name)".
        const names = [...new Set([...(f.options || []), ...(Array.isArray(value) ? value : [])])];
        const on = el('input', { type: 'checkbox', disabled: dis });
        on.checked = Array.isArray(value);
        const boxes = names.map(n => {
          const cb = el('input', { type: 'checkbox', disabled: dis, 'data-name': n });
          cb.checked = Array.isArray(value) && value.includes(n);
          return { n, cb, row: el('label', {}, [cb, n]) };
        });
        const list = el('div', { class: 'cl-names' + (on.checked ? '' : ' off') }, boxes.map(b => b.row));
        on.addEventListener('change', () => { list.classList.toggle('off', !on.checked); });
        input = el('div', { class: 'cl-pick' }, [el('label', {}, [on, 'Ration: only the ticked clients may use it']), list]);
        read = () => on.checked ? boxes.filter(b => b.cb.checked).map(b => b.n) : null;
        break;
      }
      case 'json':
        input = el('textarea', { rows: 2, placeholder: 'default: ' + showDef(f.def), disabled: dis, spellcheck: 'false' });
        input.value = value == null ? '' : JSON.stringify(value, null, 1).replace(/\n\s*/g, ' ');
        read = () => { const t = input.value.trim(); if (!t) return null; return JSON.parse(t); };
        break;
      case 'secretList': {
        input = el('div', { class: 'ck-list' });
        const rows = [];
        const addRow = (e) => {
          const nm = el('input', { type: 'text', placeholder: 'client name', disabled: dis }); nm.value = e?.name ?? '';
          const k = el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'key', disabled: dis }); k.value = e?.key ?? '';
          const rm = el('button', { class: 'btn-ghost', text: '✕', title: 'Remove this client key', disabled: dis });
          const row = el('div', { class: 'ck' }, [nm, k, rm]);
          const entry = { nm, k, row };
          rm.addEventListener('click', () => { rows.splice(rows.indexOf(entry), 1); row.remove(); onChange(); });
          for (const x of [nm, k]) x.addEventListener('input', onChange);
          rows.push(entry); input.insertBefore(row, addBtn);
        };
        const addBtn = el('button', { class: 'btn-ghost', text: '+ client key', disabled: dis });
        addBtn.addEventListener('click', () => { addRow(null); onChange(); });
        input.appendChild(addBtn);
        for (const e of (value || [])) addRow(e);
        read = () => rows.map(r => ({ name: r.nm.value.trim(), key: r.k.value }));
        break;
      }
      default:
        input = el('input', { type: 'text', placeholder: showDef(f.def), disabled: dis, spellcheck: 'false' });
        input.value = value == null ? '' : String(value);   // false shows as "false" (e.g. never use a proxy)
        read = () => input.value.trim() || null;
    }
    if (f.type !== 'secretList') input.addEventListener(f.type === 'bool' || f.type === 'enum' ? 'change' : 'input', onChange);
    return { input, read };
  }

  function settingsBadges(f) {
    return [
      f.apply === 'restart' ? el('span', { class: 'badge restart', text: 'needs restart', title: 'Saved at once, applied on the next restart' }) : null,
      f.danger ? el('span', { class: 'badge danger', text: '⚠ sensitive', title: 'Changes where traffic or tokens go, who can connect, or what runs' }) : null,
    ];
  }

  // Read-only: what each account has left of a rationed family, and who was
  // rewritten or fell back in the last 24 hours (from the last status poll).
  function familyPanel(family) {
    const box = el('div', { class: 'fam-panel' });
    const st = lastStatus;
    if (!st) { box.appendChild(el('div', { class: 'dim', text: 'Allowance and rewrites appear once the status has loaded.' })); return box; }
    const label = family === 'fable' ? 'Fable' : 'Mythos';
    const rows = (st.accounts || []).map(a => {
      const q = a.quota || {};
      let u = null; let r = null;
      if (family === 'fable' && q.unified7dFable != null) { u = q.unified7dFable; r = q.unified7dFableReset; }
      else if (q.scopedWeekly?.[family]?.utilization != null) { u = q.scopedWeekly[family].utilization; r = q.scopedWeekly[family].resetAt; }
      const deniedAt = Object.entries(a.modelDenied || {}).filter(([m]) => m.includes(family)).map(([, t]) => t).sort().pop();
      const denied = deniedAt;
      const left = u == null ? el('span', { class: 'dim', text: family === 'mythos' ? 'shares the weekly bucket' : 'not reported yet' }) : fmtPct(Math.max(0, 1 - u)) + ' left';
      const rs = r ? fmtReset(r) : null;
      return el('tr', {}, [el('td', { text: a.name }), el('td', {}, left), el('td', { class: 'dim', text: rs ? '↺ ' + rs.when : '' }),
        el('td', { text: denied ? 'refused until ' + new Date(denied).toLocaleTimeString() : (a.status || '') })]);
    });
    box.appendChild(el('table', {}, [el('tr', {}, ['Account', label + ' weekly', 'Resets', 'State'].map(h => el('th', { text: h }))), ...rows]));
    const fam = st[family] || {};
    const by = fam.byClient24h || {};
    const who = Object.keys(by).sort((x, y) => (by[y].rewritten + by[y].fallbacks) - (by[x].rewritten + by[x].fallbacks));
    box.appendChild(who.length
      ? el('table', {}, [el('tr', {}, ['Client (last 24 h)', 'Rewritten', 'Fell back'].map(h => el('th', { text: h }))),
          ...who.map(n => el('tr', {}, [el('td', { text: n }), el('td', { text: String(by[n].rewritten) }), el('td', { text: String(by[n].fallbacks) })]))])
      : el('div', { class: 'dim', text: `No ${label} request was rewritten or fell back in the last 24 hours.` }));
    return box;
  }

  function renderSettings() {
    const d = settingsData;
    settingsBody.textContent = '';
    settingsConfirm = false;
    const editors = [];
    const markDirty = (row, ed) => () => {
      let dirty;
      try { dirty = JSON.stringify(ed.read()) !== ed.initial; } catch { dirty = true; }
      row.classList.toggle('dirty', dirty);
      settingsConfirm = false;
    };

    settingsBody.appendChild(el('div', { class: 'set-intro', text: d.canEdit
      ? 'Changes are validated, the config is backed up, then saved. Hot settings apply at once; ones marked "needs restart" wait for Restart.'
      : 'Read-only: saving settings needs the shared proxy key (a client key can only view them).' }));

    // Account order — the list IS the priority.
    settingsBody.appendChild(el('div', { class: 'set-group', text: 'Account order' }));
    const expiryField = d.fields.find(f => f.key === 'expiryRouting');
    const ctl = orderControls(expiryField && expiryField.value);
    settingsBody.appendChild(el('div', { class: 'set-intro', text: ctl.arrows ? d.orderHelp : EXPIRY_RULE }));
    if (ctl.note) settingsBody.appendChild(el('div', { class: 'set-intro', text: ctl.note }));
    const prios = d.accounts.map(a => a.priority);
    if (ctl.arrows && new Set(prios).size < prios.length) {
      settingsBody.appendChild(el('div', { class: 'set-intro', text: 'Some accounts share a priority today (sessions can spread across them). Saving a new order gives each account its own place in the list.' }));
    }
    const byId = new Map(d.accounts.map(a => [a.id, a]));
    // Expiry mode: list in live pressure order (the last status poll), matched by name.
    const rankById = new Map();
    if (!ctl.arrows && lastStatus) {
      const names = rotationView(lastStatus).accounts.map(x => x.account.name);
      const idByName = new Map(d.accounts.map(a => [a.name, a.id]));
      settingsOrder = names.map(n => idByName.get(n)).filter(Boolean).concat(settingsOrder.filter(id => !names.includes(byId.get(id)?.name)));
      settingsOrder.forEach((id, i) => rankById.set(id, i));
    }
    const list = el('ol', { class: 'order-list' });
    const drawOrder = () => {
      list.textContent = '';
      settingsOrder.forEach((id, i) => {
        const a = byId.get(id);
        const up = ctl.arrows ? el('button', { class: 'btn-ghost', text: '▲', title: 'Move up (used sooner)', disabled: !d.canEdit || i === 0 }) : null;
        const dn = ctl.arrows ? el('button', { class: 'btn-ghost', text: '▼', title: 'Move down (used later)', disabled: !d.canEdit || i === settingsOrder.length - 1 }) : null;
        const swap = (j) => { [settingsOrder[i], settingsOrder[j]] = [settingsOrder[j], settingsOrder[i]]; settingsConfirm = false; drawOrder(); };
        up?.addEventListener('click', () => swap(i - 1));
        dn?.addEventListener('click', () => swap(i + 1));
        const off = (settingsAcctDirty[id]?.disabled ?? a.disabled);
        const adv = el('details', {}, [el('summary', { class: 'nm', text: a.name + (off ? ' (disabled)' : '') })]);
        const advBody = el('div', { class: 'acct-adv' });
        for (const f of d.accountFields) {
          if (f.key === 'priority') continue;
          const row = el('div', { class: 'set-row' });
          const cur = settingsAcctDirty[id]?.[f.key] ?? a[f.key];
          const ed = settingsInput(f, cur, d.canEdit, () => {
            try { (settingsAcctDirty[id] ||= {})[f.key] = ed.read(); } catch { /* bad JSON: caught on save */ (settingsAcctDirty[id] ||= {})[f.key] = undefined; }
            row.classList.add('dirty'); settingsConfirm = false;
          });
          row.append(el('label', { class: 'k' }, [f.label, ...settingsBadges(f)]), ed.input, el('div', { class: 'help', text: f.help + ' Default: ' + showDef(f.def) + '.' }));
          advBody.appendChild(row);
        }
        adv.appendChild(advBody);
        const li = el('li', { class: off ? 'off' : '' }, [el('span', { class: 'pos', text: String(i + 1) }), up, dn, adv]);
        if (!ctl.arrows && rankById.has(id)) li.querySelector('.pos').title = 'live rank by expiry pressure';
        list.appendChild(li);
      });
    };
    drawOrder();
    settingsBody.appendChild(list);

    let group = null;
    for (const f of d.fields) {
      if (f.group !== group) {
        group = f.group;
        settingsBody.appendChild(el('div', { class: 'set-group', text: group }));
        if (group === 'Fable' || group === 'Mythos') settingsBody.appendChild(familyPanel(group.toLowerCase()));
      }
      const row = el('div', { class: 'set-row', 'data-key': f.key });
      const ed = { f };
      const made = settingsInput(f, f.value, d.canEdit, () => markDirty(row, ed)());
      ed.read = made.read;
      try { ed.initial = JSON.stringify(made.read()); } catch { ed.initial = null; }
      editors.push(ed);
      const id = 'set-' + f.key.replace(/\W/g, '-');
      made.input.id = id;
      row.append(el('label', { class: 'k', for: id }, [f.label, ...settingsBadges(f)]), made.input,
        el('div', { class: 'help', text: f.help + ' Default: ' + showDef(f.def) + '.' }));
      settingsBody.appendChild(row);
    }
    if (d.unknown?.length) {
      settingsBody.appendChild(el('div', { class: 'set-intro', text: 'In the config file but not used by this version (left as is): ' + d.unknown.join(', ') }));
    }

    const saveBtn = el('button', { class: 'btn-svc', text: 'Save settings', disabled: !d.canEdit });
    const resetBtn = el('button', { class: 'btn-ghost', text: 'Discard changes' });
    const msg = el('div', { class: 'set-msg' });
    resetBtn.addEventListener('click', () => loadSettings());
    saveBtn.addEventListener('click', () => saveSettings(editors, msg, saveBtn));
    settingsBody.appendChild(el('div', { class: 'set-actions' }, [saveBtn, resetBtn, msg]));
  }

  async function saveSettings(editors, msg, saveBtn) {
    const set = {}; const problems = [];
    for (const ed of editors) {
      let v;
      try { v = ed.read(); } catch { problems.push(`${ed.f.label}: not valid JSON`); continue; }
      if (JSON.stringify(v) !== ed.initial) set[ed.f.key] = v;
    }
    const accounts = [];
    for (const [id, ch] of Object.entries(settingsAcctDirty)) {
      if (Object.values(ch).some(v => v === undefined)) { problems.push(`${settingsData.accounts.find(a => a.id === id)?.name}: a field is not valid JSON`); continue; }
      accounts.push({ id, ...ch });
    }
    const origOrder = [...settingsData.accounts].sort((a, b) => a.priority - b.priority || a.index - b.index).map(a => a.id);
    // In expiry mode the list shows live pressure order, not priority; saving it
    // would silently rewrite every priority, so no order is sent then.
    const arrowsOn = orderControls(settingsData.fields.find(f => f.key === 'expiryRouting')?.value).arrows;
    const order = arrowsOn && settingsOrder.join() !== origOrder.join() ? settingsOrder : undefined;
    msg.className = 'set-msg';
    if (problems.length) { msg.className = 'set-msg bad'; msg.textContent = ''; msg.appendChild(el('ul', {}, problems.map(p => el('li', { text: p })))); return; }
    if (!Object.keys(set).length && !accounts.length && !order) { msg.textContent = 'Nothing changed.'; return; }
    const dangerous = editors.filter(ed => ed.f.danger && ed.f.key in set).map(ed => ed.f.label)
      .concat(accounts.some(a => 'upstream' in a) ? ['Account upstream'] : []);
    if (dangerous.length && !settingsConfirm) {
      settingsConfirm = true;
      msg.className = 'set-msg bad';
      msg.textContent = `⚠ ${dangerous.join(', ')} change where traffic or tokens go or who can connect. Click Save again to confirm.`;
      return;
    }
    saveBtn.disabled = true;
    msg.textContent = 'Saving…';
    try {
      const res = await api('/teamclaude/settings', { method: 'POST', headers: { 'content-type': 'application/json', 'x-teamclaude-control': '1' }, body: JSON.stringify({ set, accounts, order }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.className = 'set-msg bad'; msg.textContent = '';
        const list = body.problems || [body.error || `HTTP ${res.status}`];
        msg.appendChild(el('ul', {}, list.map(p => el('li', { text: p }))));
        saveBtn.disabled = false;
        return;
      }
      await loadSettings();
      refresh();
      const note = el('div', { class: 'set-msg good' }, [`Saved (backup ${body.backup}). `,
        body.applied.length ? `Applied now: ${body.applied.join(', ')}. ` : '']);
      if (body.needsRestart.length) {
        const rb = el('button', { class: 'btn-restart', text: 'Restart now' });
        rb.addEventListener('click', () => restartBtn.click());
        note.append(el('span', { class: 'badge restart', text: 'needs restart' }), ` ${body.needsRestart.join(', ')} `, rb);
      }
      settingsBody.querySelector('.set-actions .set-msg')?.replaceWith(note);
    } catch (err) {
      msg.className = 'set-msg bad'; msg.textContent = 'Save failed: ' + err.message;
      saveBtn.disabled = false;
    }
  }

  async function loadSettings() {
    try {
      const res = await api('/teamclaude/settings', { cache: 'no-store' });
      if (!res.ok) { settingsBody.textContent = ''; settingsBody.appendChild(el('div', { class: 'set-intro', text: res.status === 501 ? 'Settings are not available on this host.' : `Could not load settings (HTTP ${res.status}).` })); return; }
      settingsData = await res.json();
      settingsOrder = [...settingsData.accounts].sort((a, b) => a.priority - b.priority || a.index - b.index).map(a => a.id);
      settingsAcctDirty = {};
      settingsNote.textContent = settingsData.canEdit ? '' : 'read-only';
      renderSettings();
    } catch (err) {
      settingsBody.textContent = ''; settingsBody.appendChild(el('div', { class: 'set-intro', text: 'Could not load settings: ' + err.message }));
    }
  }
  settingsWrap.addEventListener('toggle', () => { if (settingsWrap.open) loadSettings(); });
  // /ui#settings opens straight to this panel (a bookmark for the operator).
  if (globalThis.location?.hash === '#settings') settingsWrap.open = true;

  // ── Service restart ──────────────────────────────────────────
  restartBtn.addEventListener('click', async () => {
    restartBtn.disabled = true;
    restartStatusEl.textContent = 'Restarting…';
    restartPending = true;
    const notRestarting = (text) => {
